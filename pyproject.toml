[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-inference-benchmark"
version = "0.1.0"
description = "PyTorch、ONNX Runtime GPU 与 TensorRT 的 YOLO 推理性能评测"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["yolo_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

